name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint · privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff pyyaml
      - name: Ruff (config in pyproject.toml)
        run: ruff check step_rl tests scripts
      - name: Privacy gate (paths, keys, credentials in tracked files)
        run: python -m step_rl privacy-scan
      - name: Studio front end parses
        run: |
          node --check step_rl/console/static/app.js
          node --check scripts/showcase/cdp.mjs

  test:
    name: pytest · py${{ matrix.python-version }}
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      STEP_RL_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime + dev extras (no training stack)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Doctor
        run: step-rl doctor --live --no-privacy
      - name: Unit + integration tests
        run: pytest tests -q --tb=short --cov=step_rl --cov-report=xml
      - name: Verified smoke suite (real browser, 0 LLM calls)
        run: step-rl eval --suite smoke --out outputs/eval/ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-py${{ matrix.python-version }}
          path: outputs/eval/ci-smoke
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "step-rl"
dynamic = ["version"]
description = "Verifier-driven edge web agent: compiled skills, transactional runtime and step-level RL, operated from Step-RL Studio"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["web-agent", "reinforcement-learning", "playwright", "verifier", "edge-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Deterministic runtime + Studio: no torch, no GPU.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "playwright>=1.43",
]

[project.optional-dependencies]
studio = []
train = [
    "torch>=2.1",
    "transformers>=4.51",
    "accelerate>=0.28",
    "datasets>=2.18",
    "peft>=0.10",
    "trl>=0.8",
    "numpy>=1.26",
]
serve = ["vllm>=0.5", "openai>=1.30"]
track = ["wandb>=0.17", "mlflow>=2.13", "prometheus-client>=0.20"]
dev = ["pytest>=8.1", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6", "pillow>=10.2", "numpy>=1.26"]

[project.scripts]
step-rl = "step_rl.cli:main"

[project.urls]
Homepage = "https://github.com/ShaneLiu04/Step-RL"

[tool.setuptools.dynamic]
version = { attr = "step_rl.__version__" }

[tool.setuptools.packages.find]
include = ["step_rl*"]

[tool.setuptools.package-data]
"step_rl.console" = ["static/*"]
"step_rl.edge" = ["*.json"]
"step_rl.configs" = ["**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["specs", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
# Experiment scripts and thread-barrier tests join workers inside the loop body.
"scripts/*" = ["B007", "B023", "E402"]
"tests/*" = ["B023", "E402"]

[tool.isort]
profile = "black"
